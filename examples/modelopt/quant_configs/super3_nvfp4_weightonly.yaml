# Super3 (NemotronH) NVFP4 weight-only (W4A16) custom quantization recipe.
#
# Reference this from a NeMo-RL YAML config:
#
#     policy:
#       quant_cfg: "examples/modelopt/quant_configs/super3_nvfp4_weightonly.yaml"
#
# Defines W4A16: NVFP4 (e2m1, dynamic e4m3 micro-block scales) on
# weights only; activations stay in the model's native dtype (BF16/FP16).
#
# Mirrors ``mtq._nvfp4_selective_quant_cfg(["*"], weight_only=True)`` +
# Super3 BF16 disables, equivalent to ``SUPER3_NVFP4_CFG`` with input
# quantizer dropped. Inherits the same
# ``_default_disabled_quantizer_cfg`` exclusions.
#
# Disables (from ``_default_disabled_quantizer_cfg``): BatchNorm1d/2d/3d,
# LeakyReLU, ``*lm_head*``, ``*proj_out.*``, ``*block_sparse_moe.gate*``,
# ``*router*``, ``*mlp.gate.*``, ``*mlp.shared_expert_gate.*``,
# ``*linear_attn.conv1d*``, ``*mixer.conv1d*``, ``*output_layer*``,
# ``output.*``.
#
# Plus the Super3-specific BF16 layer set:
#   - MTP block (Megatron-Bridge sets ``keep_mtp_spec_in_bf16=True`` for
#     every Nemotron-3-Super recipe; the MTP loss weight is 0 in the QARL
#     config but the modules still exist).
#
# DELIBERATELY LEFT OPEN: no empirical sensitivity exclusions are enabled
# below. Production can add patterns to the commented block at the end of
# the ``quant_cfg`` list, or point ``policy.quant_cfg`` at a different
# recipe, without touching the training config.
#
# See https://github.com/NVIDIA/Model-Optimizer for the full set of
# supported quantizer options and built-in PTQ recipes.
#
# Only the `quantize:` section is consumed by `mtq.quantize`; `metadata:`
# is informational.
metadata:
  recipe_type: ptq
  description: Super3 NVFP4 W4A16 (weight-only) recipe.
quantize:
  algorithm: max
  quant_cfg:
    # Deny-all-then-enable: start by disabling every quantizer (including
    # KV-cache q/k/v_bmm_quantizers, which would otherwise be enabled by a
    # wildcard '*' true and produce NaN amax on dummy calibration), then
    # explicitly enable just '*weight_quantizer' for W4A16.
    - quantizer_name: '*'
      enable: false
    - quantizer_name: '*weight_quantizer'
      enable: true
      cfg:
        block_sizes:
          -1: 16
          type: dynamic
          scale_bits: e4m3
        num_bits: e2m1
    # Standard ModelOpt _default_disabled_quantizer_cfg exclusions
    # (sensitive / structurally-incompatible layers).
    - parent_class: 'nn.BatchNorm1d'
      quantizer_name: '*'
      enable: false
    - parent_class: 'nn.BatchNorm2d'
      quantizer_name: '*'
      enable: false
    - parent_class: 'nn.BatchNorm3d'
      quantizer_name: '*'
      enable: false
    - parent_class: 'nn.LeakyReLU'
      quantizer_name: '*'
      enable: false
    - quantizer_name: '*lm_head*'
      enable: false
    - quantizer_name: '*proj_out.*'
      enable: false
    - quantizer_name: '*block_sparse_moe.gate*'
      enable: false
    - quantizer_name: '*router*'
      enable: false
    - quantizer_name: '*mlp.gate.*'
      enable: false
    - quantizer_name: '*mlp.shared_expert_gate.*'
      enable: false
    - quantizer_name: '*linear_attn.conv1d*'
      enable: false
    - quantizer_name: '*mixer.conv1d*'
      enable: false
    - quantizer_name: '*output_layer*'
      enable: false
    - quantizer_name: 'output.*'
      enable: false
    # Super3-specific BF16: the MTP block (attention-anchor + expert layer)
    # is kept in native dtype, matching keep_mtp_spec_in_bf16=True in the
    # Megatron-Bridge Super3 recipe.
    - quantizer_name: '*mtp*'
      enable: false
    # ------------------------------------------------------------------
    # Production tuning block (disabled by default).
    #
    # Uncomment/adapt the patterns below to keep Super3-sensitive layers in
    # BF16. Candidates, from the architecture and the Super NVFP4 pretrain
    # recipe:
    #
    #   Attention projections (88-layer pattern: attention anchors at
    #   7/16/25/36/47/58/69/78):
    #     - quantizer_name: '*.[q|k|v|o]_proj.*'
    #       enable: false
    #     - quantizer_name: '*.qkv_proj.*'
    #       enable: false
    #     - quantizer_name: '*.linear_qkv.*'
    #       enable: false
    #     - quantizer_name: '*.linear_proj.*'
    #       enable: false
    #
    #   Mamba layer immediately preceding each attention anchor:
    #     - quantizer_name: '*.layers.6.*'
    #       enable: false
    #     - quantizer_name: '*.layers.15.*'
    #       enable: false
    #     - quantizer_name: '*.layers.24.*'
    #       enable: false
    #     - quantizer_name: '*.layers.35.*'
    #       enable: false
    #     - quantizer_name: '*.layers.46.*'
    #       enable: false
    #     - quantizer_name: '*.layers.57.*'
    #       enable: false
    #     - quantizer_name: '*.layers.68.*'
    #       enable: false
    #     - quantizer_name: '*.layers.77.*'
    #       enable: false
    #
    #   Trailing layers (last 14 mirror nemotron_3_super_bf16_with_nvfp4_mixed,
    #   i.e. num_layers_at_end_in_bf16=14): '*.layers.74.*' ... '*.layers.87.*'
    # ------------------------------------------------------------------
